name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the downloads to a release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = python -c "import duallink; print(duallink.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} but duallink/__init__.py says $version"
            exit 1
          }

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests (on real Windows networking)
        run: python -m pytest -v

      - name: Check the app imports on Windows
        run: python -c "import pystray, duallink.service, duallink.tray; print('imports ok')"

      - name: Record which repository this build belongs to (for update checks)
        shell: bash
        run: echo "REPO = \"$GITHUB_REPOSITORY\"" > duallink/_build_info.py

      - name: Build DualLink (the engine, as a folder - starts fast, nothing to unpack on each start)
        run: |
          python tools/make_icon.py
          python -m PyInstaller --noconfirm --onedir --windowed --name DualLink --icon build/icon.ico `
            --distpath dist/folder --workpath build/folder `
            --add-data "duallink/assets;duallink/assets" `
            --hidden-import pystray._win32 --hidden-import duallink._build_info `
            main.py

      - name: Check the folder build starts
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\folder\DualLink\DualLink.exe -ArgumentList "--cleanup" -PassThru -Wait
          if ($p.ExitCode -ne 0) { Write-Error "DualLink.exe --cleanup exited with $($p.ExitCode)"; exit 1 }

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Build the window (WinUI 3, compiled ahead of time)
        shell: pwsh
        run: |
          $version = python -c "import duallink; print(duallink.__version__)"
          $common = @("native/DualLinkWindow/DualLinkWindow.csproj", "-c", "Release", "-r", "win-x64",
                      "-p:Platform=x64", "-p:Version=$version", "-o", "dist/native")
          dotnet publish @common -p:PublishAot=true
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::Native AOT build failed - building the window without AOT instead"
            Remove-Item dist/native -Recurse -Force -ErrorAction SilentlyContinue
            dotnet publish @common -p:PublishAot=false
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Remove-Item dist/native/*.pdb -ErrorAction SilentlyContinue
          $files = Get-ChildItem dist/native -Recurse -File
          "Window: {0:N1} MB in {1} files" -f (($files | Measure-Object Length -Sum).Sum / 1MB), $files.Count
          Copy-Item dist/native dist/folder/DualLink/DualLinkWindow -Recurse

      - name: Screenshots of every screen of the window (demo data)
        shell: pwsh
        continue-on-error: true
        run: |
          $p = Start-Process -FilePath dist\folder\DualLink\DualLinkWindow\DualLinkWindow.exe `
                 -ArgumentList "--demo", "--screenshots", "ci/native" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Host "::warning::The screenshot run timed out" }
          Get-Content ci/native/shots.log

      - name: Memory report (engine in the tray, then with the window open)
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = (Resolve-Path dist\folder\DualLink\DualLink.exe).Path
          $info = "$env:APPDATA\DualLink\engine.json"
          Remove-Item $info -ErrorAction SilentlyContinue
          $null = Start-Process -FilePath $exe -ArgumentList "--minimized" -PassThru
          for ($i = 0; $i -lt 60 -and -not (Test-Path $info); $i++) { Start-Sleep -Milliseconds 500 }
          Start-Sleep -Seconds 8
          $e = Get-Content $info | ConvertFrom-Json
          $h = @{ "X-DualLink-Token" = $e.token }
          function Call($name, $body = '{"args": []}') {
            (Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:$($e.port)/api/$name" -Headers $h `
              -ContentType "application/json" -Body $body).result
          }
          function MB($b) { [math]::Round($b / 1MB, 1) }
          function WindowMemory() {
            # the window process the engine started (and anything it started)
            $all = Get-CimInstance Win32_Process
            $todo = @($all | Where-Object { $_.ParentProcessId -eq $e.pid -and $_.Name -like "DualLink*.exe" })
            $found = @()
            while ($todo.Count -gt 0) {
              $p = $todo[0]; $found += $p
              $todo = @($todo | Select-Object -Skip 1) + @($all | Where-Object { $_.ParentProcessId -eq $p.ProcessId })
            }
            $ws = 0; $priv = 0
            foreach ($p in $found) {
              $gp = Get-Process -Id $p.ProcessId -ErrorAction SilentlyContinue
              if ($gp) { $ws += $gp.WorkingSet64; $priv += $gp.PrivateMemorySize64 }
            }
            return @{ Count = $found.Count; WS = $ws; Private = $priv }
          }
          function Screenshot($path) {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            New-Item -ItemType Directory -Force ci | Out-Null
            $bmp.Save($path)
          }
          $engine = Get-Process -Id $e.pid
          $rows = @("### DualLink memory", "", "| | Working set | Private |", "|---|---|---|")
          $rows += "| Engine - DualLink in the tray | $(MB $engine.WorkingSet64) MB | $(MB $engine.PrivateMemorySize64) MB |"
          Write-Host "ping: $((Call ping) | ConvertTo-Json -Compress)"

          Call open_window | Out-Null
          Start-Sleep -Seconds 12
          $m = WindowMemory
          $rows += "| Window - only while open ($($m.Count) process) | $(MB $m.WS) MB | $(MB $m.Private) MB |"
          Screenshot "ci\window.png"
          Write-Host "ping: $((Call ping) | ConvertTo-Json -Compress)"
          $engine.Refresh()
          $rows += "| Engine with a window open | $(MB $engine.WorkingSet64) MB | $(MB $engine.PrivateMemorySize64) MB |"

          Call quit | Out-Null
          Start-Sleep -Seconds 5
          $left = @(Get-Process -Name DualLink, DualLinkWindow -ErrorAction SilentlyContinue).Count
          $rows += ""
          $rows += "DualLink processes left after Quit: $left"
          $rows | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          $rows | Write-Host

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ci-report
          path: ci/
          if-no-files-found: ignore

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = python -c "import duallink; print(duallink.__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\DualLink.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v5
        with:
          name: DualLink
          path: dist/DualLink-Setup-*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DualLink-Setup-*.exe
          generate_release_notes: true
