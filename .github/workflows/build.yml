name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the downloads to a release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@v2

      - name: Read the app version (Cargo.toml) and check the tag matches it
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          if ("${{ github.ref }}".StartsWith("refs/tags/v") -and "v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} but Cargo.toml says $version"
            exit 1
          }

      - name: Run tests (on real Windows networking)
        run: cargo test --workspace

      - name: Build DualLink (engine and window)
        env:
          DUALLINK_REPO: ${{ github.repository }}   # for update checks
        shell: pwsh
        run: |
          cargo build --release --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist/DualLink | Out-Null
          Copy-Item target/release/DualLink.exe, target/release/DualLinkWindow.exe dist/DualLink/
          Get-ChildItem dist/DualLink | ForEach-Object { "{0}: {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: Check the engine starts
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\DualLink\DualLink.exe -ArgumentList "--cleanup" -PassThru -Wait
          if ($p.ExitCode -ne 0) { Write-Error "DualLink.exe --cleanup exited with $($p.ExitCode)"; exit 1 }

      - name: Screenshots of every screen of the window (demo data)
        shell: pwsh
        continue-on-error: true
        run: |
          $p = Start-Process -FilePath dist\DualLink\DualLinkWindow.exe `
                 -ArgumentList "--demo", "--screenshots", "ci/shots" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Host "::warning::The screenshot run timed out" }
          Get-Content ci/shots/shots.log

      - name: Memory report (engine in the tray, then with the window open)
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = (Resolve-Path dist\DualLink\DualLink.exe).Path
          $info = "$env:APPDATA\DualLink\engine.json"
          Remove-Item $info -ErrorAction SilentlyContinue
          $null = Start-Process -FilePath $exe -ArgumentList "--minimized" -PassThru
          for ($i = 0; $i -lt 60 -and -not (Test-Path $info); $i++) { Start-Sleep -Milliseconds 500 }
          Start-Sleep -Seconds 8
          $e = Get-Content $info | ConvertFrom-Json
          $h = @{ "X-DualLink-Token" = $e.token }
          function Call($name, $body = '{"args": []}') {
            (Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:$($e.port)/api/$name" -Headers $h `
              -ContentType "application/json" -Body $body).result
          }
          function MB($b) { [math]::Round($b / 1MB, 1) }
          function WindowMemory() {
            # the window process the engine started (and anything it started)
            $all = Get-CimInstance Win32_Process
            $todo = @($all | Where-Object { $_.ParentProcessId -eq $e.pid -and $_.Name -like "DualLink*.exe" })
            $found = @()
            while ($todo.Count -gt 0) {
              $p = $todo[0]; $found += $p
              $todo = @($todo | Select-Object -Skip 1) + @($all | Where-Object { $_.ParentProcessId -eq $p.ProcessId })
            }
            $ws = 0; $priv = 0
            foreach ($p in $found) {
              $gp = Get-Process -Id $p.ProcessId -ErrorAction SilentlyContinue
              if ($gp) { $ws += $gp.WorkingSet64; $priv += $gp.PrivateMemorySize64 }
            }
            return @{ Count = $found.Count; WS = $ws; Private = $priv }
          }
          function Screenshot($path) {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            New-Item -ItemType Directory -Force ci | Out-Null
            $bmp.Save($path)
          }
          $engine = Get-Process -Id $e.pid
          $rows = @("### DualLink memory", "", "| | Working set | Private |", "|---|---|---|")
          $rows += "| Engine - DualLink in the tray | $(MB $engine.WorkingSet64) MB | $(MB $engine.PrivateMemorySize64) MB |"
          Write-Host "ping: $((Call ping) | ConvertTo-Json -Compress)"

          Call open_window | Out-Null
          Start-Sleep -Seconds 12
          $m = WindowMemory
          $rows += "| Window - only while open ($($m.Count) process) | $(MB $m.WS) MB | $(MB $m.Private) MB |"
          Screenshot "ci\window.png"
          Write-Host "ping: $((Call ping) | ConvertTo-Json -Compress)"
          $engine.Refresh()
          $rows += "| Engine with a window open | $(MB $engine.WorkingSet64) MB | $(MB $engine.PrivateMemorySize64) MB |"

          Call quit | Out-Null
          Start-Sleep -Seconds 5
          $left = @(Get-Process -Name DualLink, DualLinkWindow -ErrorAction SilentlyContinue).Count
          $rows += ""
          $rows += "DualLink processes left after Quit: $left"
          $rows | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          $rows | Write-Host

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ci-report
          path: ci/
          if-no-files-found: ignore

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" installer\DualLink.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v5
        with:
          name: DualLink
          path: dist/DualLink-Setup-*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DualLink-Setup-*.exe
          generate_release_notes: true
