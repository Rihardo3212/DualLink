[workspace]
resolver = "2"
members = ["common", "engine", "window"]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
authors = ["Rihards"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = "0.61"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
