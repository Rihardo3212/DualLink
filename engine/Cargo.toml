[package]
name = "duallink-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "DualLink"
path = "src/main.rs"

[dependencies]
duallink-common = { path = "../common" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
socket2 = "0.6"
tiny_http = "0.12"
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
url = "2"
sha2 = "0.10"
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Registry",
    "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
    "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock",
] }

[build-dependencies]
winresource = "0.1"
